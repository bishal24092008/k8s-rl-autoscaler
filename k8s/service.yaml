apiVersion: v1
kind: Service
metadata:
  name: flask-backend-service
  labels:
    app: flask-backend
spec:
  # Using LoadBalancer to expose it externally if running on a cloud provider, 
  # or NodePort if testing locally (e.g., Minikube). Change to 'ClusterIP' for internal only.
  type: LoadBalancer
  selector:
    # This must match the labels in our deployment.yaml
    app: flask-backend
  ports:
  - port: 80           # The port exposed to the outside world
    targetPort: 5000   # The port the Flask container is listening on
    protocol: TCP
